[package]
name = "veida"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Generate images from Rust with no API key and no account, via the free tier of veida.ai"
license = "MIT"
readme = "README.md"
homepage = "https://veida.ai"
repository = "https://github.com/hanshs474/veida-rs"
documentation = "https://docs.rs/veida"
keywords = ["image-generation", "ai", "text-to-image", "no-api-key", "chatgpt-image"]
categories = ["api-bindings", "multimedia::images"]

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
